# Asistente de la Diplomatura en IA Generativa en https://licdia.unlu.edu.ar/dev-ia/api/
#
# Va en /etc/nginx/snippets/asistente-dev-ia.conf, incluido desde el server{} del sitio (sites-enabled/default),
# junto a los de rag-unlu y entregas. No se recorta el prefijo: la app ya sirve bajo /dev-ia/api/.

location = /dev-ia/api/mapa {
    limit_req zone=asistente_mapa burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8030;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location = /dev-ia/api/chat {
    limit_req zone=asistente_chat burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8030;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    proxy_buffering off;          # la respuesta llega en flujo (Server-Sent Events)
}

# Opinión sobre una respuesta (útil / no me sirvió, comentario corto)
location = /dev-ia/api/opinion {
    limit_req zone=asistente_opinion burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8030;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# Cualquier otra ruta de la API no existe
location /dev-ia/api/ { return 404; }
