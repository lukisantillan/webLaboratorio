# Zonas de límite de tasa del asistente de dev-ia.
# Va en /etc/nginx/conf.d/asistente-dev-ia-zonas.conf: limit_req_zone solo vale en el contexto http.
#
# Cada pregunta calcula un embedding y paga una llamada al modelo de lenguaje: 15 por minuto es holgado para una
# persona y corta a un script. La clave es la dirección de origen y la UNLu sale por pocas direcciones compartidas,
# por eso la ráfaga del snippet es generosa.
limit_req_zone $binary_remote_addr zone=asistente_chat:10m rate=15r/m;
# El mapa del sitio se pide una vez por visita y no cuesta nada.
limit_req_zone $binary_remote_addr zone=asistente_mapa:10m rate=120r/m;
# Las opiniones no pasan por el modelo: solo se limita el abuso.
limit_req_zone $binary_remote_addr zone=asistente_opinion:10m rate=30r/m;
